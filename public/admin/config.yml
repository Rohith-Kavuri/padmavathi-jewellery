# Decap CMS — admin page for Padmavathi Jewellers (open /admin/ on the site)
#
# Live site: staff sign in with GitHub; every "Publish" becomes a commit on
# the main branch, and Netlify rebuilds the site automatically (~1 minute).
backend:
  name: github
  repo: Rohith-Kavuri/padmavathi-jewellery
  branch: main
  commit_messages:
    update: "Admin: update {{collection}} ({{slug}})"
    uploadMedia: "Admin: upload {{path}}"
    deleteMedia: "Admin: delete {{path}}"

# Local testing: run `npx decap-server` in a second terminal next to
# `npm run dev`, then open http://localhost:5173/admin/index.html.
# No login is needed locally and changes are saved straight to your files.
local_backend: true

# Uploaded photos go here and are served from /images/uploads/...
media_folder: public/images/uploads
public_folder: /images/uploads

site_url: https://padmavathijewellery.netlify.app
display_url: https://padmavathijewellery.netlify.app

collections:
  - name: catalog
    label: Catalogue
    editor:
      preview: false
    files:
      # ---------------------------------------------------------------- categories
      - name: categories
        label: Categories
        file: src/content/categories.json
        fields:
          - name: categories
            label: Categories
            label_singular: Category
            widget: list
            summary: "{{fields.label_en}}  ·  {{fields.image | ternary('✓ has photo', 'no photo yet')}}"
            hint: "Click a category to change its photo or name. The photo is shown on its big card under 'Shop by category' on the homepage."
            fields:
              - name: image
                label: Category card photo
                widget: image
                required: false
                choose_url: false
                hint: "Upload: click 'Choose an image'. Replace: 'Choose different image'. Remove (shows the gold icon instead): 'Remove image'. Best: one piece on a dark or velvet background, square or portrait, at least 1000 × 1000 px, JPG or WebP under ~500 KB."
              - { name: label_en, label: Name (English), widget: string }
              - { name: label_te, label: Name (Telugu), widget: string, required: false }
              - name: key
                label: Category code (internal — don't change for existing categories)
                widget: string
                hint: "Links products to this category, e.g. Necklace, Bangles. Only set this when adding a new category."

      # ---------------------------------------------------------------- products
      - name: products
        label: Products
        file: src/content/products.json
        fields:
          - name: products
            label: Products
            label_singular: Product
            widget: list
            summary: "{{fields.name_en}}  ·  {{fields.category}}  ·  {{fields.image | ternary('✓ has photo', 'no photo yet')}}"
            fields:
              - name: image
                label: Photo
                widget: image
                required: false
                hint: "Square photo works best (at least 800 × 800 px). Leave empty to show the line icon."
                choose_url: false
              - { name: name_en, label: Name (English), widget: string }
              - { name: name_te, label: Name (Telugu), widget: string, required: false }
              - name: category
                label: Category
                widget: relation
                collection: catalog
                file: categories
                search_fields: ["categories.*.label_en"]
                display_fields: ["categories.*.label_en"]
                value_field: "categories.*.key"
              - name: metal
                label: Metal
                widget: select
                options: [Gold, Diamond, Platinum, Silver]
              - name: price
                label: Price (₹)
                widget: number
                value_type: int
                min: 0
                hint: "For gold pieces enter the 22K price — 18K and 24K prices are worked out automatically."
              - name: weight
                label: Weight (grams)
                widget: number
                value_type: float
                required: false
                hint: "Leave empty for diamond pieces."
              - name: tag
                label: Badge
                widget: select
                required: false
                default: ""
                options:
                  - { label: "None", value: "" }
                  - { label: "Bestseller", value: "Bestseller" }
                  - { label: "New", value: "New" }
              - { name: desc_en, label: Description (English), widget: text, required: false }
              - { name: desc_te, label: Description (Telugu), widget: text, required: false }
              - name: id
                label: Product number
                widget: number
                value_type: int
                hint: "Must be unique. For a new product use the next number after the highest one. Higher numbers show first under 'Newest'."

  # ------------------------------------------------------------------ homepage
  - name: homepage
    label: Homepage
    editor:
      preview: false
    files:
      - name: rates
        label: "Today's gold & metal rates"
        file: src/content/rates.json
        fields:
          - name: updated
            label: Rates date
            widget: datetime
            format: "YYYY-MM-DD"
            date_format: "DD MMM YYYY"
            time_format: false
            hint: "Change this to today's date whenever you update the rates. Shown on the site as 'Updated on …'."
          - { name: gold_24k, label: "24K gold (₹ per gram)", widget: number, value_type: int, min: 0 }
          - { name: gold_22k, label: "22K gold (₹ per gram)", widget: number, value_type: int, min: 0 }
          - { name: gold_18k, label: "18K gold (₹ per gram)", widget: number, value_type: int, min: 0, required: false, hint: "Leave empty or 0 to hide." }
          - { name: silver, label: "Silver (₹ per gram)", widget: number, value_type: int, min: 0, required: false, hint: "Leave empty or 0 to hide." }
          - { name: platinum, label: "Platinum (₹ per gram)", widget: number, value_type: int, min: 0, required: false, hint: "Leave empty or 0 to hide." }

      - name: catalogue
        label: "Catalogues (PDF)"
        file: src/content/catalogue.json
        fields:
          - name: catalogues
            label: Catalogues
            label_singular: Catalogue
            widget: list
            collapsed: true
            summary: "{{fields.title_en}} · {{fields.category}}"
            hint: "Add one or more catalogues. Visitors open them from the 'Browse catalogues' button, which shows a popup with a tab for each category. Drag to change the order. Remove all of them to show 'coming soon'."
            fields:
              - { name: title_en, label: Name (English), widget: string, hint: "e.g. Bridal Collection 2026" }
              - { name: title_te, label: Name (Telugu), widget: string, required: false }
              - name: category
                label: Category
                widget: relation
                collection: catalog
                file: categories
                search_fields: ["categories.*.label_en"]
                display_fields: ["categories.*.label_en"]
                value_field: "categories.*.key"
                required: false
                hint: "Which category tab it appears under in the catalogue popup. Leave empty for a general catalogue (shown under 'All')."
              - name: pdf
                label: PDF file
                widget: file
                choose_url: false
                hint: "Upload the catalogue PDF (best under ~10 MB)."
              - name: cover
                label: Cover picture
                widget: image
                required: false
                choose_url: false
                hint: "Picture of the front page, shown as the book cover. Portrait, about 700 × 1000 px, JPG or WebP. Without one, a maroon cover with the name is shown."
              - name: updated
                label: Date
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: "DD MMM YYYY"
                time_format: false
                required: false
              - name: pages
                label: Number of pages
                widget: number
                value_type: int
                min: 0
                required: false
      - name: hero
        label: Hero slides (top banner)
        file: src/content/hero.json
        fields:
          - name: show_brand_slide
            label: Show the logo slide first
            widget: boolean
            default: true
            hint: "The maroon slide with the Padmavathi logo and necklace."
          - name: slides
            label: Banner slides
            label_singular: Slide
            widget: list
            summary: "{{fields.alt_en}}"
            hint: "Drag slides to change their order. They play after the logo slide."
            fields:
              - name: image
                label: Image (laptop / desktop)
                widget: image
                choose_url: false
                hint: "Wide images fill best: about 2560 × 960 px. Portrait images also work — they're shown whole with a soft blurred background. JPG or WebP, under ~500 KB."
              - name: image_mobile
                label: Image for phones (optional)
                widget: image
                required: false
                choose_url: false
                hint: "Leave empty to use the image above. Portrait works best on phones: about 1080 × 1350 px."
              - name: fit
                label: How to show it
                widget: select
                default: contain
                options:
                  - { label: "Show the whole image (blurred edges fill any space)", value: contain }
                  - { label: "Fill the whole banner (edges may be cropped)", value: cover }
              - name: alt_en
                label: Short description (English)
                widget: string
                hint: "What's in the picture — read out by screen readers and used by Google."
              - name: alt_te
                label: Short description (Telugu)
                widget: string
                required: false

      - name: featured
        label: Featured collection (big maroon spotlight)
        file: src/content/featured.json
        fields:
          - name: image
            label: Photo
            widget: image
            choose_url: false
            hint: "Portrait works best (about 900 × 1100 px). Avoid photos with text printed on them — the title and text below are shown next to it."
          - { name: eyebrow_en, label: Small heading (English), widget: string, required: false }
          - { name: eyebrow_te, label: Small heading (Telugu), widget: string, required: false }
          - { name: title_en, label: Title (English), widget: string }
          - { name: title_te, label: Title (Telugu), widget: string, required: false }
          - { name: text_en, label: Text (English), widget: text }
          - { name: text_te, label: Text (Telugu), widget: text, required: false }
          - { name: button_en, label: Button (English), widget: string }
          - { name: button_te, label: Button (Telugu), widget: string, required: false }
          - name: category
            label: Button opens
            widget: select
            options:
              - { label: "All jewellery", value: "All" }
              - { label: "Necklaces", value: "Necklace" }
              - { label: "Earrings", value: "Earrings" }
              - { label: "Bangles", value: "Bangles" }
              - { label: "Bracelets", value: "Bracelets" }
              - { label: "Rings", value: "Rings" }
              - { label: "Mangalsutra", value: "Mangalsutra" }
              - { label: "Bridal Sets", value: "Bridal Set" }
              - { label: "Chains", value: "Chains" }
              - { label: "Pendants", value: "Pendant" }

      - name: occasions
        label: Shop by occasion
        file: src/content/occasions.json
        fields:
          - name: occasions
            label: Occasion cards
            label_singular: Occasion
            widget: list
            summary: "{{fields.title_en}}  ·  {{fields.image | ternary('✓ has photo', 'no photo yet')}}"
            hint: "Drag to reorder. Four cards look best."
            fields:
              - name: image
                label: Photo
                widget: image
                required: false
                choose_url: false
                hint: "Portrait works best (about 900 × 1200 px)."
              - { name: title_en, label: Title (English), widget: string }
              - { name: title_te, label: Title (Telugu), widget: string, required: false }
              - { name: text_en, label: Short line (English), widget: string, required: false }
              - { name: text_te, label: Short line (Telugu), widget: string, required: false }
              - name: category
                label: Card opens
                widget: select
                options:
                  - { label: "All jewellery", value: "All" }
                  - { label: "Necklaces", value: "Necklace" }
                  - { label: "Earrings", value: "Earrings" }
                  - { label: "Bangles", value: "Bangles" }
                  - { label: "Bracelets", value: "Bracelets" }
                  - { label: "Rings", value: "Rings" }
                  - { label: "Mangalsutra", value: "Mangalsutra" }
                  - { label: "Bridal Sets", value: "Bridal Set" }
                  - { label: "Chains", value: "Chains" }
                  - { label: "Pendants", value: "Pendant" }

      - name: store
        label: Shop details (address, phone, WhatsApp, hours)
        file: src/content/store.json
        fields:
          - { name: name, label: Shop name, widget: string }
          - { name: address_en, label: Address (English), widget: string }
          - { name: address_te, label: Address (Telugu), widget: string, required: false }
          - name: map_query
            label: Map search text
            widget: string
            hint: "What to search on Google Maps to find the shop, e.g. 'Padmavathi Jewellers, Main Road, Giddalur'."
          - { name: phone, label: Phone number (shown on the site), widget: string, required: false, hint: "e.g. +91 98765 43210. Leave empty to hide." }
          - name: whatsapp
            label: WhatsApp number
            widget: string
            required: false
            hint: "Turns on the WhatsApp buttons. Digits with country code, e.g. 919876543210 (a 10-digit number gets +91 added). Leave empty to hide."
          - { name: email, label: Email, widget: string, required: false }
          - { name: hours_en, label: Opening hours (English), widget: text, required: false, hint: "e.g. Mon–Sat 10:00 am – 8:30 pm" }
          - { name: hours_te, label: Opening hours (Telugu), widget: text, required: false }
          - { name: instagram, label: Instagram link, widget: string, required: false, hint: "Full link, e.g. https://instagram.com/yourshop — shows the Instagram icon. Leave empty to hide it." }
          - { name: youtube, label: YouTube link, widget: string, required: false, hint: "Full link to the channel, e.g. https://youtube.com/@yourshop" }
          - { name: facebook, label: Facebook link, widget: string, required: false, hint: "Optional. Full link to the Facebook page." }
